<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="Description" content="Browser based application to convert a GPX route into a FIT course for Garmin Edge" />
  <title>GPX2FIT Converter</title>

  <link rel="icon" href="images/logo-32.png" sizes="32x32" />
  <link rel="icon" href="images/logo-96.png" sizes="96x96" />
  <link rel="icon" href="images/logo-128.png" sizes="128x128" />
  <link rel="icon" href="images/logo-192.png" sizes="192x192" />
  <link rel="icon" href="images/logo-228.png" sizes="228x228" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.1/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link rel="stylesheet" href="css/fit-route.css" />

  <style>
    :root {
      color-scheme: light dark;
      --primary: #0061a8;
      --bg: #ffffff;
      --bg-dark: #121212;
      --text: #1a1a1a;
      --text-dark: #eaeaea;
    }
    @media (prefers-color-scheme: dark) {
      body { background: var(--bg-dark); color: var(--text-dark); }
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* prevent scrolling */
    }
    #main {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    /* Ensure fit-route stretches fully */
    fit-route {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0; /* critical for flex children to shrink properly */
    }
    /* Make the inner container of fit-route also fill height */
    fit-route > div {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    /* Make the map fill all remaining space */
    #route-map {
      flex: 1 1 auto;
      min-height: 0; /* important for flexbox */
    }
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      color: var(--text);
    }
    .top-card {
      text-align: center;
      margin-top: 2rem;
    }
    .top-card img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .top-card h1 {
      margin-top: 0.5rem;
      font-size: 1.8rem;
      font-weight: 500;
    }
    .middle-card {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 3rem 0;
    }
    .file-btn {
      font-size: 1.2rem;
      padding: 1rem 2rem;
      background-color: #0061a8;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .file-btn:hover { background-color: #004d80; }
    .bottom-note {
      font-size: 0.8rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .bottom-note a { color: var(--primary); text-decoration: none; }
    .bottom-note a:hover { text-decoration: underline; }
    
    /* Beautiful toast-style error */
    .error-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1055;
      min-width: 300px;
      max-width: 90%;
      background: #dc3545;
      color: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(220, 53, 69, 0.3);
      padding: 16px 20px;
      animation: slideUp 0.3s ease-out;
    }
    
    .error-toast.success {
      background: #198754;
      box-shadow: 0 8px 25px rgba(25, 135, 84, 0.3);
    }
    
    .error-toast.warning {
      background: #ffc107;
      color: #000;
      box-shadow: 0 8px 25px rgba(255, 193, 7, 0.3);
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
    
    .error-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    
    .error-message {
      flex: 1;
      font-weight: 500;
      line-height: 1.4;
    }
    
    .error-close {
      background: none;
      border: none;
      color: inherit;
      opacity: 0.8;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    
    .error-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <main id="main" class="flex-grow-1 d-flex flex-column w-100 h-100">

    <!-- Minimal first screen -->
    <div v-if="showInfo" class="d-flex flex-column align-items-center justify-content-center flex-grow-1 p-3 w-100">
      <div class="top-card">
        <img src="images/logo-196.png" alt="App Icon">
        <h1>GPX2FIT Converter</h1>
      </div>

      <div class="bottom-note">
        <a href="https://gitlab.com/alvaroemtnez/gpx2fit-android" target="_blank">Source code</a>. 
        Based in <a href="https://gitlab.com/nwholloway/fit-route" target="_blank">fit-route by Nick Holloway</a>.
      </div>
    </div>

    <!-- Beautiful toast-style error -->
    <div v-if="error" class="error-toast">
      <div class="error-content">
        <div class="error-message">
          <i class="fas fa-exclamation-circle me-2"></i>
          {{ error }}
        </div>
        <button class="error-close" @click="error = null">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <fit-route @show-info="onShowInfo" @error="onError" class="flex-grow-1"></fit-route>
  </main>

  <!-- Vue and supporting scripts -->
  <script src="https://unpkg.com/vue@3.2.40/dist/vue.global.prod.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.1/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.js" defer></script>
  <script type="module" src="js/spreadcheck.js"></script>
  <script type="module" src="js/app.js"></script>
  <script nomodule type="text/javascript" src="js/unsupported.js"></script>

  <!-- Vue templates -->
  <script type="text/x-template" id="error-message-template">
    <div role="alert" class="alert alert-danger">{{ message }}</div>
  </script>

  <script type="text/x-template" id="empty-template"></script>

  <script type="text/x-template" id="file-upload-template">
    <form enctype="multipart/form-data" novalidate>
      <div class="d-flex flex-column justify-content-center align-items-center w-100">

        <!-- Hidden file input -->
        <input
          v-if="!file"
          type="file"
          title=" "
          aria-label="Select GPX"
          accept=".gpx,application/gpx+xml,application/octet-stream"
          style="display:none"
          ref="fileInput"
          @change="
            file = $event.target.files[0];
            if(file) onSubmit();
          "
        >

        <!-- Blue button triggers file input -->
        <button v-if="!file" type="button" class="btn btn-primary" @click="$refs.fileInput.click()">
          Select GPX file to start...
        </button>

        <!-- Once file is selected, show filename only -->
        <div v-else class="text-center mt-3">
          {{ file.name }}
        </div>

      </div>
    </form>
  </script>

  <script type="text/x-template" id="fit-route-template">
    <div class="d-flex flex-column w-100 h-100">
      <template v-if="!gpxFile">
        <file-upload @submit="onFileUpload"></file-upload>
      </template>
      <template v-if="route">
      <div class="d-flex flex-column w-100 flex-grow-1">
        <!-- Editor controls -->
        <div class="bg-light p-3">
          <form novalidate>
            <div class="d-flex justify-content-center py-3">
              <input class="btn-check" id="km" type="radio" value="km" v-model="units">
              <label class="btn btn-outline-secondary w-25 mx-1" :class="{ active: units == 'km' }" for="km">km</label>
              <input class="btn-check" id="miles" type="radio" value="miles" v-model="units">
              <label class="btn btn-outline-secondary w-25 mx-1" :class="{ active: units == 'miles' }" for="miles">miles</label>
            </div>
          </form>

          <route-info :route="route" :units="units" @name="setName" @duration="setDuration"></route-info>

          <form novalidate>
            <div class="mb-1">
              <label class="form-label">Include</label>
              <div class="form-check form-switch ms-2">
                <input class="form-check-input" type="checkbox" id="includeTiming" v-model="includeTiming" :disabled="true">
                <label class="form-check-label" for="includeTiming">Timing</label>
              </div>
              <div class="form-check form-switch ms-2">
                <input class="form-check-input" type="checkbox" id="includeTurns" v-model="includeTurns">
                <label class="form-check-label" for="includeTurns">Turn Alerts</label>
              </div>
            </div>
          </form>

          <div class="mt-4 d-flex flex-column">
            <div class="d-flex justify-content-around">
              <button class="btn btn-secondary m-2" @click="onClear">Clear</button>
              <button class="btn btn-primary m-2" @click="onFitDownload">Export FIT file</button>
            </div>
            <a ref="downloadAnchor" class="d-none" download="COURSE.fit" href="#"></a>
          </div>
        </div>
        <div class="flex-grow-1 w-100 d-flex">
          <route-map :route="route" :units="units" class="flex-grow-1"></route-map>
        </div>
      </div>
      </template>
    </div>
  </script>

  <script type="text/x-template" id="route-info-template">
    <form novalidate>
      <div class="d-flex flex-column">
        <div class="mb-3">
          <label class="form-label" for="routeName">Name</label>
          <input id="routeName" type="text" v-model="routeName" @keydown.enter.prevent class="form-control text-primary" data-lpignore="true">
          <i v-if="routeNameTooLong" class="fas fa-exclamation-triangle text-warning input-feedback" title="Name will be truncated on Garmin device" aria-hidden="true"></i>
        </div>
        <div class="mb-3">
          <label class="form-label" for="distance">Distance</label>
          <div class="input-group">
            <input id="distance" type="text" v-model="distance" readonly class="form-control text-primary bg-light">
            <div class="input-group-text">{{ units }}</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="speed">Average Speed</label>
          <div class="input-group">
            <input id="speed" type="text" v-model="avgSpeedField" class="form-control text-primary" data-lpignore="true">
            <div class="input-group-text">{{ speedUnits }}</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="time">Goal Time</label>
          <div class="input-group">
            <input id="time" type="text" v-model="goalTime" readonly class="form-control text-primary bg-light">
            <span class="input-group-text">h:mm:ss</span>
          </div>
        </div>
      </div>
    </form>
  </script>

  <script type="text/x-template" id="route-map-template">
    <div id="route-map" class="bg-light w-100 flex-grow-1"></div>
  </script>
</body>
</html>
