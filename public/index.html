<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="Description" content="Browser based application to convert a GPX route into a FIT course for Garmin Edge" />
  <title>GPX2FIT Converter</title>

  <link rel="icon" href="images/logo-32.png" sizes="32x32" />
  <link rel="icon" href="images/logo-96.png" sizes="96x96" />
  <link rel="icon" href="images/logo-128.png" sizes="128x128" />
  <link rel="icon" href="images/logo-192.png" sizes="192x192" />
  <link rel="icon" href="images/logo-228.png" sizes="228x228" />

  <!-- Local offline CSS files -->
  <link rel="stylesheet" href="css/beercss/beer.min.css" />
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/leaflet-fullscreen.css" />
  <link rel="stylesheet" href="css/fit-route.css" />
</head>

<!-- Colors come from js/material-theme.js (Material 3 scheme, from the system's dynamic color on Android 12+),
     which adds the light or dark class. v-cloak hides the uncompiled Vue template until the app is mounted. -->
<body>
  <main id="main" v-cloak>
    <div v-if="error" class="snackbar error active">
      <i>error</i>
      <div class="max">{{ error }}</div>
      <button class="transparent circle small" aria-label="Close" @click="error = null">
        <i>close</i>
      </button>
    </div>

    <fit-route @show-info="onShowInfo" @error="onError"></fit-route>
  </main>

  <!-- Local configuration (not committed, see js/config.example.js) -->
  <script src="js/config.js"></script>

  <!-- Local offline JavaScript files -->
  <script src="js/vue.global.prod.js"></script>
  <script src="js/leaflet.js"></script>
  <script src="js/leaflet-fullscreen.js"></script>
  <script type="module" src="js/spreadcheck.js"></script>
  <script type="module" src="js/app.js"></script>
  <script nomodule type="text/javascript" src="js/unsupported.js"></script>

  <!-- Vue templates -->
  <script type="text/x-template" id="error-message-template">
    <div role="alert" class="alert alert-danger">{{ message }}</div>
  </script>

  <script type="text/x-template" id="empty-template"></script>

  <script type="text/x-template" id="file-upload-template">
    <div class="start-screen">
      <div class="start-header">
        <img src="images/logo-196.png" alt="">
        <h1>GPX2FIT Converter</h1>
        <p>Convert GPX routes into FIT courses for your Garmin device</p>
      </div>

      <input
        type="file"
        aria-label="Select GPX"
        accept=".gpx,application/gpx+xml,application/octet-stream"
        hidden
        ref="fileInput"
        @change="onFileSelect"
      >
      <button type="button" class="extra" @click="$refs.fileInput.click()">
        <i>upload_file</i>
        <span>Select GPX file</span>
      </button>

      <p class="start-footer">
        <a href="https://code.alvaroedo.io/alvaroemtnez/gpx2fit-android" target="_blank">Source code</a>.
        Based on <a href="https://gitlab.com/nwholloway/fit-route" target="_blank">fit-route by Nick Holloway</a>.
      </p>
    </div>
  </script>

  <script type="text/x-template" id="fit-route-template">
    <div class="fit-route">
      <file-upload v-if="!gpxFile" @submit="onFileUpload" @error="onError"></file-upload>

      <template v-if="route">
        <section class="route-panel">
          <nav class="group connected units" role="radiogroup" aria-label="Units">
            <button v-for="option in ['km', 'miles']" :key="option" type="button"
                    :class="{ active: units === option }" role="radio" :aria-checked="units === option"
                    @click="units = option">
              <i v-if="units === option">check</i>
              <span>{{ option }}</span>
            </button>
          </nav>

          <route-info :route="route" :units="units" @name="setName" @duration="setDuration"></route-info>

          <div class="switches">
            <label class="switch-row">
              <span class="switch">
                <input type="checkbox" v-model="includeTiming" disabled>
                <span></span>
              </span>
              <span>Timing</span>
            </label>
            <label class="switch-row">
              <span class="switch">
                <input type="checkbox" v-model="includeTurns">
                <span></span>
              </span>
              <span>Turn alerts</span>
            </label>
          </div>

          <nav class="actions">
            <button type="button" class="border max" @click="onClear">
              <i>close</i>
              <span>Clear</span>
            </button>
            <button type="button" class="max" @click="onFitDownload">
              <i>{{ isNative ? 'share' : 'download' }}</i>
              <span>Export FIT</span>
            </button>
          </nav>

          <article v-if="showGadgetbridgeTip" class="tip secondary-container">
            <i>lightbulb</i>
            <p class="max">
              Tip: use <a href="https://gadgetbridge.org/" target="_blank">Gadgetbridge</a> to send your FIT track
              to your Garmin device without Garmin Connect.
            </p>
            <button type="button" class="transparent circle small" aria-label="Close" @click="dismissGadgetbridgeTip">
              <i>close</i>
            </button>
          </article>
          <a ref="downloadAnchor" hidden download="COURSE.fit" href="#"></a>
        </section>

        <route-map :route="route" :units="units"></route-map>
      </template>
    </div>
  </script>

  <script type="text/x-template" id="route-info-template">
    <form novalidate class="route-info" @submit.prevent>
      <div class="field label border" :class="{ invalid: routeNameTooLong, suffix: routeNameTooLong }">
        <input id="routeName" type="text" v-model="routeName" placeholder=" " data-lpignore="true">
        <label for="routeName">Name</label>
        <i v-if="routeNameTooLong">warning</i>
        <span v-if="routeNameTooLong" class="helper">Too long, it will be truncated on Garmin devices</span>
      </div>

      <div class="field label fill">
        <input id="distance" type="text" :value="distance" readonly placeholder=" ">
        <label for="distance">Distance</label>
        <span class="unit">{{ units }}</span>
      </div>

      <div class="field-pair">
        <div class="field label border">
          <input id="speed" type="text" inputmode="decimal" v-model="avgSpeedField" placeholder=" " data-lpignore="true">
          <label for="speed">Avg speed</label>
          <span class="unit">{{ speedUnits }}</span>
        </div>
        <div class="field label fill">
          <input id="time" type="text" :value="goalTime" readonly placeholder=" ">
          <label for="time">Goal time</label>
        </div>
      </div>
    </form>
  </script>

  <script type="text/x-template" id="route-map-template">
    <div id="route-map"></div>
  </script>
</body>
</html>
